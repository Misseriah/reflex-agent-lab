[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reflex-baseline"
version = "0.3.0"
description = "Independent implementation of REFLEX selective agent control"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.23,<5", "numpy>=2,<3", "scipy>=1.15,<2"]

[project.optional-dependencies]
embeddings = ["sentence-transformers>=5,<6"]
agentdojo = ["agentdojo @ git+https://github.com/ethz-spylab/agentdojo.git@089ed468cf3ed0322acc66b0211f26d9d90dbf60"]

[project.scripts]
reflex = "reflex.cli:main"

[tool.setuptools.packages.find]
include = ["reflex*"]
